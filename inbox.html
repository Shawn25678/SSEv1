<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Still Sane Inbox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="inbox-app">
    <div class="inbox-shell">
      <header class="inbox-head">
        <img class="sigil tiny" src="still-sane-sigil.png" alt="" />
        <div class="inbox-head-copy">
          <p class="inbox-kicker">Still Sane Inbox</p>
          <h1>Issues / Feedback</h1>
          <p class="muted" id="inbox-count">Waiting…</p>
        </div>
        <div class="inbox-head-actions">
          <div class="inbox-filters" id="inbox-filters"></div>
          <button class="btn ghost" id="inbox-refresh" type="button">Refresh</button>
          <button class="btn ghost" id="inbox-settings" type="button">Settings</button>
        </div>
      </header>
      <div class="inbox-layout">
        <div class="inbox-list" id="inbox-list"></div>
        <article class="inbox-detail panel" id="inbox-detail">
          <p class="muted">Pick a note on the left.</p>
        </article>
      </div>
    </div>
    <div class="inbox-modal" id="inbox-modal" hidden>
      <div class="inbox-modal-card panel">
        <div class="inbox-modal-top">
          <h2>Settings</h2>
          <button class="btn ghost" id="inbox-settings-close" type="button">Close</button>
        </div>
        <p class="muted" id="inbox-settings-note">Keys stay on this PC. Never in the player pack.</p>
        <form id="inbox-config" class="feedback-form">
          <label>Project URL
            <input name="url" autocomplete="off" spellcheck="false" />
          </label>
          <label>anon public
            <input name="anonKey" type="password" autocomplete="off" spellcheck="false" />
          </label>
          <label>service_role
            <input name="serviceKey" type="password" autocomplete="off" spellcheck="false" />
          </label>
          <div class="row-actions">
            <button class="btn gold" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
    <script>
      let items = [];
      let issues = [];
      let openId = "";
      let filter = "all";
      let cloud = false;
      let needSetup = true;
      let host = "";
      let cfg = { url: "", anonKey: "", serviceKey: "" };

      function esc(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function when(ms) {
        const n = Number(ms);
        if (!n) return "";
        return new Date(n).toLocaleString();
      }

      function send(msg) {
        if (window.chrome?.webview) chrome.webview.postMessage(msg);
      }

      function rows() {
        const notes = items.map((item) => ({
          id: item.id,
          kind: "app",
          title: item.title,
          body: item.body,
          at: item.at,
          read: !!item.read,
          version: item.version,
          league: item.league,
          page: item.page,
        }));
        const git = issues.map((item) => ({
          id: item.id,
          kind: "github",
          title: item.title,
          body: item.body,
          at: item.at,
          read: true,
          number: item.number,
          url: item.url,
        }));
        const all = notes.concat(git).sort((a, b) => (b.at || 0) - (a.at || 0));
        if (filter === "new") return all.filter((row) => row.kind === "app" && !row.read);
        if (filter === "github") return all.filter((row) => row.kind === "github");
        if (filter === "app") return all.filter((row) => row.kind === "app");
        return all;
      }

      function paintFilters() {
        const unread = items.filter((item) => !item.read).length;
        const chips = [
          ["all", "All"],
          ["new", "New" + (unread ? " " + unread : "")],
          ["app", "App"],
          ["github", "GitHub"],
        ];
        document.getElementById("inbox-filters").innerHTML = chips
          .map(([id, label]) => `<button type="button" class="inbox-chip${filter === id ? " is-on" : ""}" data-filter="${id}">${esc(label)}</button>`)
          .join("");
      }

      function paintList() {
        const list = document.getElementById("inbox-list");
        const shown = rows();
        if (!shown.length) {
          list.innerHTML = `<div class="inbox-empty"><strong>Nothing here</strong><span>Player Send and GitHub issues show up in this list.</span></div>`;
          return;
        }
        list.innerHTML = shown
          .map((row) => {
            const on = row.id === openId ? " is-on" : "";
            const fresh = row.kind === "app" && !row.read ? " is-unread" : "";
            const tag = row.kind === "github" ? "#" + row.number : "App";
            return `<button type="button" class="inbox-item${on}${fresh}" data-open="${esc(row.id)}">
              <span class="inbox-item-top">
                <span class="inbox-tag inbox-tag-${row.kind}">${esc(tag)}</span>
                ${row.kind === "app" && !row.read ? `<span class="inbox-dot"></span>` : ""}
              </span>
              <strong>${esc(row.title)}</strong>
              <span>${esc(when(row.at))}</span>
            </button>`;
          })
          .join("");
      }

      function paintDetail() {
        const detail = document.getElementById("inbox-detail");
        const shown = rows();
        const item = shown.find((row) => row.id === openId) || shown[0];
        if (!item) {
          openId = "";
          detail.innerHTML = `
            <div class="inbox-hero">
              <img class="sigil" src="still-sane-sigil.png" alt="" />
              <h2>Issues / Feedback</h2>
              <p class="muted">Notes from the player app and open GitHub issues.</p>
            </div>`;
          return;
        }
        openId = item.id;
        if (item.kind === "github") {
          detail.innerHTML = `
            <p class="inbox-tag inbox-tag-github">GitHub #${esc(item.number)}</p>
            <h2>${esc(item.title)}</h2>
            <p class="muted">${esc(when(item.at))}</p>
            <pre class="inbox-body">${esc(item.body || "(no body)")}</pre>
            <div class="row-actions">
              <button class="btn gold" data-open-url="${esc(item.url)}" type="button">Open on GitHub</button>
            </div>`;
          return;
        }
        const meta = [item.version && "v" + item.version, item.league, item.page].filter(Boolean).join(" · ");
        detail.innerHTML = `
          <p class="inbox-tag inbox-tag-app">App</p>
          <h2>${esc(item.title)}</h2>
          <p class="muted">${esc(when(item.at))}${meta ? " · " + esc(meta) : ""}</p>
          <pre class="inbox-body">${esc(item.body)}</pre>
          <div class="row-actions">
            <button class="btn ghost" data-delete="${esc(item.id)}" type="button">Delete</button>
            <button class="btn gold" data-toggle="${esc(item.id)}" type="button">${item.read ? "Mark new" : "Mark read"}</button>
          </div>`;
      }

      function paintCount() {
        const count = document.getElementById("inbox-count");
        const unread = items.filter((item) => !item.read).length;
        const bits = [];
        if (items.length) bits.push(items.length + " note" + (items.length === 1 ? "" : "s"));
        if (unread) bits.push(unread + " new");
        if (issues.length) bits.push(issues.length + " GitHub");
        if (cloud && host) bits.push(host);
        count.textContent = bits.length ? bits.join(" · ") : needSetup ? "Set up Supabase in Settings to receive notes." : "No notes yet.";
        const settings = document.getElementById("inbox-settings");
        settings.classList.toggle("is-alert", needSetup);
      }

      function paint() {
        paintFilters();
        paintCount();
        paintList();
        paintDetail();
      }

      function fillSettings() {
        const form = document.getElementById("inbox-config");
        if (!form) return;
        form.url.value = cfg.url || "";
        form.anonKey.value = cfg.anonKey || "";
        form.serviceKey.value = cfg.serviceKey || "";
        const note = document.getElementById("inbox-settings-note");
        note.textContent = cloud
          ? "Connected" + (host ? " · " + host : "") + ". Keys stay on this PC."
          : "Keys stay on this PC. Never in the player pack.";
      }

      function openSettings(on) {
        const modal = document.getElementById("inbox-modal");
        modal.hidden = !on;
        if (on) {
          send({ type: "inbox-config" });
          fillSettings();
        }
      }

      chrome.webview?.addEventListener("message", (event) => {
        let msg = event.data;
        if (typeof msg === "string") {
          try {
            msg = JSON.parse(msg);
          } catch {
            return;
          }
        }
        if (msg?.type === "inbox-toast") {
          const note = document.getElementById("inbox-settings-note");
          if (note) note.textContent = String(msg.text || "");
          return;
        }
        if (msg?.type === "inbox-config") {
          cfg = {
            url: String(msg.url || ""),
            anonKey: String(msg.anonKey || ""),
            serviceKey: String(msg.serviceKey || ""),
          };
          cloud = !!msg.cloud;
          host = String(msg.host || host || "");
          fillSettings();
          return;
        }
        if (msg?.type === "inbox-list") {
          items = Array.isArray(msg.items) ? msg.items : [];
          issues = Array.isArray(msg.issues) ? msg.issues : [];
          cloud = !!msg.cloud;
          needSetup = !!msg.needSetup;
          host = String(msg.host || "");
          paint();
        }
      });

      document.addEventListener("submit", (event) => {
        if (event.target.id !== "inbox-config") return;
        event.preventDefault();
        const data = new FormData(event.target);
        send({
          type: "inbox-save-config",
          url: String(data.get("url") || ""),
          anonKey: String(data.get("anonKey") || ""),
          serviceKey: String(data.get("serviceKey") || ""),
        });
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest("#inbox-refresh")) {
          send({ type: "inbox-refresh" });
          return;
        }
        if (event.target.closest("#inbox-settings")) {
          openSettings(true);
          return;
        }
        if (event.target.closest("#inbox-settings-close") || event.target.id === "inbox-modal") {
          openSettings(false);
          return;
        }
        const chip = event.target.closest("[data-filter]");
        if (chip) {
          filter = chip.dataset.filter;
          paint();
          return;
        }
        const href = event.target.closest("[data-open-url]");
        if (href) {
          send({ type: "open-url", url: href.dataset.openUrl });
          return;
        }
        const open = event.target.closest("[data-open]");
        if (open) {
          openId = open.dataset.open;
          const item = items.find((row) => row.id === openId);
          if (item && !item.read) send({ type: "inbox-read", id: openId });
          else paint();
          return;
        }
        const del = event.target.closest("[data-delete]");
        if (del) {
          send({ type: "inbox-delete", id: del.dataset.delete });
          openId = "";
          return;
        }
        const toggle = event.target.closest("[data-toggle]");
        if (toggle) {
          const item = items.find((row) => row.id === toggle.dataset.toggle);
          send({ type: item?.read ? "inbox-unread" : "inbox-read", id: toggle.dataset.toggle });
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") openSettings(false);
      });

      send({ type: "inbox-ready" });
    </script>
  </body>
</html>
