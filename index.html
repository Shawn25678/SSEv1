<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still Sane, Exile?</title>
    <script>
      if (window.sseStartup?.testerUnlocked === true) document.documentElement.classList.add("tester-unlocked");
    </script>
    <link rel="icon" href="still-sane-sigil.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="top-navigation">
    <div class="win-chrome">
      <span class="win-gold-confetti" aria-hidden="true">
        <i style="--lane:16%;--drift:13px;--fall-time:3.9s;--phase:-2.7s"></i>
        <i style="--lane:20%;--drift:-17px;--fall-time:4.6s;--phase:-.8s"></i>
        <i style="--lane:25%;--drift:24px;--fall-time:3.4s;--phase:-1.5s"></i>
        <i style="--lane:30%;--drift:15px;--fall-time:4.4s;--phase:-3.5s"></i>
        <i style="--lane:34%;--drift:-11px;--fall-time:3.8s;--phase:-1.2s"></i>
        <i style="--lane:39%;--drift:22px;--fall-time:5.2s;--phase:-4.1s"></i>
        <i style="--lane:43%;--drift:-14px;--fall-time:3.6s;--phase:-2.3s"></i>
        <i style="--lane:48%;--drift:25px;--fall-time:4.5s;--phase:-.4s"></i>
        <i style="--lane:52%;--drift:-19px;--fall-time:3.3s;--phase:-1.8s"></i>
        <i style="--lane:56%;--drift:16px;--fall-time:4.7s;--phase:-3.2s"></i>
        <i style="--lane:61%;--drift:-12px;--fall-time:3.7s;--phase:-1.1s"></i>
        <i style="--lane:65%;--drift:22px;--fall-time:5s;--phase:-2.6s"></i>
        <i style="--lane:69%;--drift:-21px;--fall-time:3.6s;--phase:-3s"></i>
        <i style="--lane:74%;--drift:14px;--fall-time:4.2s;--phase:-.6s"></i>
        <i style="--lane:78%;--drift:-16px;--fall-time:4.9s;--phase:-3.6s"></i>
        <i style="--lane:82%;--drift:25px;--fall-time:3.8s;--phase:-1.6s"></i>
        <i style="--lane:87%;--drift:-24px;--fall-time:4.5s;--phase:-2.2s"></i>
        <i style="--lane:92%;--drift:-11px;--fall-time:3.5s;--phase:-2.8s"></i>
      </span>
      <template id="tester-title-banner">
        <picture class="win-tester-banner" aria-hidden="true">
          <source media="(prefers-reduced-motion: reduce)" srcset="art/sse-tester-banner-static.webp" />
          <img src="art/sse-tester-banner.webp" width="540" height="180" alt="" draggable="false" />
        </picture>
      </template>
      <div class="win-drag" data-win-drag title="Still Sane, Exile?">
        <span class="win-sigil"><img class="sigil tiny" src="still-sane-sigil.png" alt="" /></span>
        <strong>Still Sane, Exile?</strong>
      </div>
      <div class="win-btns">
        <button type="button" class="win-btn win-close" data-title-quit aria-label="Hide SSE" title="Hide SSE to tray"><img src="art/window-close.png" alt="" draggable="false" /></button>
      </div>
    </div>
    <header class="app-menu" id="app-menu">
      <nav class="menu-nav" aria-label="Menu">
        <button class="menu-link is-active" data-view="dash" type="button">
          <span class="nav-symbol" aria-hidden="true">◈</span>
          <span class="menu-link-title">Dashboard</span>
          <span class="menu-ripple" aria-hidden="true"></span>
        </button>
        <button class="menu-link" data-view="econ" type="button">
          <span class="nav-symbol" aria-hidden="true">↗</span>
          <span class="menu-link-title">Economy</span>
          <span class="menu-ripple" aria-hidden="true"></span>
        </button>
        <button class="menu-link" data-view="wealth" type="button">
          <span class="menu-link-title">Wealth</span>
          <span class="menu-ripple" aria-hidden="true"></span>
        </button>
        <button class="menu-link" data-view="settings" type="button">
          <span class="nav-symbol" aria-hidden="true">⚙</span>
          <span class="menu-link-title">Settings</span>
          <span class="menu-ripple" aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <div class="shell">
    <div class="bg-glow"></div>
    <div class="app">
      <header class="top">
        <div class="top-actions">
          <label class="boss-picker" id="boss-picker">
            <span>Current boss</span>
            <select id="farm-boss" aria-label="Current boss"></select>
          </label>
          <label class="league-field">
            <span>League</span>
            <select id="league-input">
              <option value="Forbidden Rites">Forbidden Rites</option>
            </select>
          </label>
          <div class="rate-pop" id="rate-pop">
            <div class="rate-pop-row">
              <button class="rate-pop-btn" id="rate-pop-btn" type="button" aria-describedby="rate-pop-card">Rates</button>
            </div>
            <div class="rate-pop-card" id="rate-pop-card" role="tooltip"></div>
          </div>
          <div class="price-clock rate-clock" id="rate-clock" role="status" title="PoE 2 trade: searches used of the limit, then the window resets.">
            <span id="rate-clock-label">Rate limiting</span>
            <strong id="rate-clock-time">0 of 1 · resets 5s</strong>
          </div>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="toolbar" id="boss-toolbar">
        <input id="search" type="search" aria-label="Search bosses or uniques" placeholder="Search bosses or uniques…" />
        <div class="filters" id="filters"></div>
      </section>

      <main id="main"></main>
    </div>
    </div>

    <dialog id="boss-dialog" class="sheet">
      <div id="boss-dialog-body"></div>
    </dialog>

    <dialog id="log-dialog" class="sheet">
      <div id="log-dialog-body"></div>
    </dialog>

    <dialog id="wealth-setup" class="sheet wealth-setup-dialog"></dialog>

    <input id="wealth-screenshot-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <input id="import-file" type="file" accept="application/json" hidden />
    <div id="toast" class="toast" hidden></div>
    <div id="price-overlay" class="price-overlay" hidden></div>
    <div id="item-tip" class="item-tip" hidden></div>

    <script src="bosses.js"></script>
    <script src="app.js"></script>
  </body>
</html>
